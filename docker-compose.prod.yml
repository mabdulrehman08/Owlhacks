# Production overrides for a single server (e.g. a Vultr instance):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Caddy is public (80/443). The frontend and backend stay on the compose
# network; Docker-published ports bypass most host firewalls, so they are removed.
services:
  backend:
    ports: !reset []
    restart: unless-stopped

  frontend:
    ports: !reset []
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-readtheroom.cooking}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  caddy-data:
  caddy-config:
